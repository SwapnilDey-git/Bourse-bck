name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-shared:
    name: test + typecheck (src/lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  typecheck-worker:
    name: typecheck (worker/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker

  typecheck-worker-cf:
    name: typecheck (worker-cf/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-cf/package-lock.json
      - run: npm ci
        working-directory: worker-cf
      - run: npm run typecheck
        working-directory: worker-cf
